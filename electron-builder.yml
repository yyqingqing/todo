appId: com.qingqing.app
productName: 青青
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  # 托盘图标是运行时用 app.getAppPath() 读的，不打包进去会加载失败
  - build/icon.png
  - "!**/*.map"

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  # exe 必须是纯 ASCII 文件名。实测：Run 键里指向「青青.exe」时，
  # 配置、编码、权限全部正常，Windows 开机就是不执行。
  # 换英文名排除这个变量；界面、快捷方式、卸载项仍然显示「青青」。
  executableName: Qingqing
  # 安装包文件名同理（GitHub release 附件对中文也支持不好）
  artifactName: Qingqing-${version}-setup.${ext}

nsis:
  # 不做一键安装：用户要能选安装位置
  oneClick: false
  # 装到当前用户下（%LOCALAPPDATA%\Programs\青青），不需要管理员权限。
  # 这也是数据库能放在安装目录内的前提 —— Program Files 对普通用户只读。
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 青青
  installerLanguages:
    - zh_CN
  language: "2052"
  # 数据在安装目录的 data/ 下，卸载时由 installer.nsh 询问是否保留
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
